<!DOCTYPE html>
<html lang="da">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Redaction+10:ital,wght@0,400;0,700;1,400&family=Redaction:ital,wght@0,400;0,700;1,400&family=Tinos:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    rel="stylesheet">
  <title>Opsamling</title>
  <link rel="stylesheet" href="./starter.css">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <header class="site-header">
    <div class="header-content">

      <img class="site-logo" src="./imgs/logoheader.svg">
      <nav class="site-nav">
        <ul class="menu">
          <li class="close-menu">
            <button class="close-btn">&times;</button>
          </li>
          <li><a href="./">Forside</a></li>
          <li><a href="./svg.html">Interaktiv SVG</a></li>
          <li><a href="./form.html" aria-current="page">Formular</a></li>
          <li><a href="./koeb.html">Billetter</a></li>
        </ul>
      </nav>
      <div class="burger">
        <button class="burgerimg">
          <img src="./imgs/Burger.svg" alt="burger">
        </button>
      </div>
    </div>

  </header>

  <main>
    <section class="opsamling-page">
      <div class="opsamling-intro">
        <p class="result-subtitle">MAGIC DAYS · DIN PERSONLIGE LÆSNING</p>
        <h1>Din magiske følgesvend er...</h1>
        <h2 id="result-title"></h2>

        <p id="result-intro"></p>
      </div>

      <article class="opsamling-placeholder">

        <div class="companion-image" id="companion-image">
          <img src="./imgs/kanin.svg" id="kanin-image" alt="kanin foran månen">
          <img src="./imgs/Kat.svg" id="kat-image" alt="kat foran månen ">
          <img src="./imgs/ravn.svg" id="krage-image" alt="ravn foran månen">
        </div>

        <div class="companion-description">
          <h3>Om din følgesvend</h3>
          <p id="result-description"></p>

          <h3>Dette kendetegner dig</h3>
          <ul id="result-traits"></ul>
        </div>

        <p class="result-ending">
          Må din magiske rejse begynde...
        </p>

        <div class="actions">
          <a class="button" href="./form.html">Tag quizzen igen</a>
        </div>

      </article>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-content">
      <p>MagicDays</p>
    </div>
  </footer>
  <script src="./script.js"></script>
</body>

</html>
